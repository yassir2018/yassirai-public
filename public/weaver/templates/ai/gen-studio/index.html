<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenStudio | AI Artwork</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --text: #fafafa;
      --accent: #E4E4E7;
      --border: #27272a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    h1, h2, .bold { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; }
    a { text-decoration: none; color: inherit; }

    .nav { padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .logo { font-size: 2.5rem; }
    
    .btn { background: var(--text); color: var(--bg); border: none; padding: 0.8rem 1.5rem; font-family: 'Inter'; font-weight: 500; font-size: 0.9rem; cursor: pointer; border-radius: 4px; transition: 0.3s; }
    .btn:hover { background: #ccc; }

    .generator-section { display: flex; height: calc(100vh - 85px); }
    
    /* Sidebar Tools */
    .sidebar { width: 350px; background: var(--surface); border-right: 1px solid var(--border); padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; overflow-y: auto; }
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .c-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #a1a1aa; font-weight: 500; }
    .c-textarea { background: var(--bg); border: 1px solid var(--border); padding: 1rem; color: var(--text); font-family: 'Inter'; border-radius: 4px; min-height: 120px; resize: none; outline: none; }
    .c-textarea:focus { border-color: var(--text); }
    
    .c-select { background: var(--bg); border: 1px solid var(--border); padding: 0.8rem; color: var(--text); border-radius: 4px; outline: none; }
    .slider { width: 100%; margin-top: 10px; }

    /* Canvas Area */
    .canvas { flex: 1; padding: 2rem; display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle at center, #1f1f22 0%, var(--bg) 100%); }
    .canvas-header { width: 100%; display: flex; justify-content: space-between; margin-bottom: 1rem; color: #a1a1aa; font-size: 0.9rem; }
    
    .output-img { width: 100%; max-width: 800px; aspect-ratio: 16/9; background: var(--bg); border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; border-radius: 8px; }
    .output-img img { width: 100%; height: 100%; object-fit: cover; }
    
    .overlay-actions { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; }
    .o-btn { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    .o-btn:hover { background: white; color: black; }

    /* Gallery Row */
    .gallery { width: 100%; max-width: 800px; margin-top: 2rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .g-thumb { aspect-ratio: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; cursor: pointer; opacity: 0.6; transition: 0.3s; }
    .g-thumb:hover, .g-thumb.active { opacity: 1; border-color: var(--text); }
    .g-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .footer-bar { padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); color: #52525b; font-size: 0.8rem; }
    .footer-bar a:hover { color: var(--text); }

    @media (max-width: 900px) {
      .generator-section { flex-direction: column; height: auto; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      .gallery { grid-template-columns: repeat(2, 1fr); }
      .footer-bar { flex-direction: column; gap: 0.5rem; text-align: center; }
    }

  </style>
</head>
<body>
  <nav class="nav">
    <div class="logo">GENSTUDIO</div>
    <div style="display:flex; gap: 20px; align-items: center;">
      <span style="color: #a1a1aa; font-size: 0.9rem;">Credits: 1,450</span>
      <button class="btn">Upgrade</button>
    </div>
  </nav>

  <div class="generator-section">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="control-group">
        <label class="c-label">Prompt</label>
        <textarea class="c-textarea">A futuristic cyberpunk city during heavy rain, neon lights reflecting on wet concrete, ultra realistic, cinematic lighting, 8k resolution, Unreal Engine 5 render.</textarea>
      </div>
      
      <div class="control-group">
        <label class="c-label">Negative Prompt</label>
        <textarea class="c-textarea" style="min-height: 60px;">Blurry, distorted, text, watermark, low quality.</textarea>
      </div>

      <div class="control-group">
        <label class="c-label">Model Engine</label>
        <select class="c-select">
          <option>GenStudio XL v2.0</option>
          <option>Alpha-Realism</option>
          <option>Anime Diffusion</option>
        </select>
      </div>

      <div class="control-group">
        <label class="c-label">Aspect Ratio</label>
        <select class="c-select">
          <option>16:9 (Cinematic)</option>
          <option>1:1 (Square)</option>
          <option>9:16 (Portrait)</option>
        </select>
      </div>

      <div class="control-group" style="margin-top: auto;">
        <button class="btn" style="width: 100%; padding: 1rem; font-size: 1.1rem; background: #fff;">Generate (4 Credits)</button>
      </div>
    </div>

    <!-- Canvas -->
    <div class="canvas">
      <div class="canvas-header">
        <span>Generation #84920</span>
        <span>0.8s render time</span>
      </div>
      
      <div class="output-img">
        <img src="assets/img/ai-gen-studio/image-1.webp" alt="Generated Art">
        <div class="overlay-actions">
          <button class="o-btn">Upscale</button>
          <button class="o-btn">Variations</button>
          <button class="o-btn">Download</button>
        </div>
      </div>

      <div class="gallery">
        <div class="g-thumb active"><img src="assets/img/ai-gen-studio/image-1.webp"></div>
        <div class="g-thumb"><img src="assets/img/ai-gen-studio/image-2.webp"></div>
        <div class="g-thumb"><img src="assets/img/ai-gen-studio/image-3.webp"></div>
        <div class="g-thumb"><img src="assets/img/ai-gen-studio/image-4.webp"></div>
      </div>
    </div>
  </div>
  <footer class="footer-bar">
    <span>GENSTUDIO</span>
    <div style="display: flex; gap: 2rem;"><a href="#">Discord</a><a href="#">Twitter</a><a href="#">Docs</a></div>
    <span>&copy; 2026 GenStudio AI</span>
  </footer>
</body>
</html>
