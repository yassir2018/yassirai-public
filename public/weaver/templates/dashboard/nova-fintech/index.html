<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova | Crypto Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="../../../assets/img/dashboard-nova-fintech/auto-1.webp"></script>
  <style>
    :root {
      --bg: #050810;
      --surface: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.05);
      --green: #00FF66;
      --cyan: #00E5FF;
      --text: #FFFFFF;
      --text-muted: #8A92A6;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; display: flex; min-height: 100vh; }
    h1, h2, h3, .space { font-family: 'Space Grotesk', sans-serif; }
    
    body::before { content:''; position:fixed; top:-20%; right:-10%; width: 50vw; height: 50vh; background: radial-gradient(circle, rgba(0, 255, 102, 0.15) 0%, transparent 60%); filter:blur(100px); pointer-events:none; }
    body::after { content:''; position:fixed; bottom:-20%; left:-10%; width: 50vw; height: 50vh; background: radial-gradient(circle, rgba(0, 229, 255, 0.1) 0%, transparent 60%); filter:blur(100px); pointer-events:none; }

    /* Sidebar */
    .sidebar { width: 250px; background: rgba(5, 8, 16, 0.6); backdrop-filter: blur(20px); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 2rem 0; z-index: 10; }
    .logo { font-size: 1.5rem; font-family: 'Space Grotesk'; font-weight: 700; color: var(--text); padding: 0 2rem; margin-bottom: 3rem; display: flex; align-items: center; gap: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .logo span { color: var(--green); text-shadow: 0 0 10px rgba(0, 255, 102, 0.5); }
    .nav-item { padding: 1rem 2rem; font-size: 0.9rem; font-weight: 500; color: var(--text-muted); display: flex; align-items: center; gap: 1rem; border-left: 3px solid transparent; transition: 0.3s; cursor: pointer; }
    .nav-item:hover, .nav-item.active { background: linear-gradient(90deg, rgba(0,255,102,0.1) 0%, transparent 100%); color: var(--text); border-left-color: var(--green); text-shadow: 0 0 10px var(--green); }
    
    /* Main */
    .main { flex: 1; padding: 2rem; display: flex; flex-direction: column; gap: 2rem; z-index: 10; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 1.8rem; font-weight: 600; }
    .wallet-btn { background: var(--surface); border: 1px solid var(--border); padding: 0.8rem 1.5rem; border-radius: 12px; font-weight: 600; color: var(--green); backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(0,255,102,0.1); cursor: pointer; transition: 0.3s; }
    .wallet-btn:hover { border-color: var(--green); box-shadow: 0 0 30px rgba(0,255,102,0.2); }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 16px; backdrop-filter: blur(16px); position: relative; overflow: hidden; transition: 0.3s; }
    .stat-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-3px); }
    .stat-lbl { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .stat-val { font-size: 2rem; font-weight: 700; font-family: 'Space Grotesk'; }
    .stat-change { font-size: 0.8rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 20px; display: inline-block; margin-top: 0.5rem; }
    .stat-change.up { color: var(--green); background: rgba(0,255,102,0.1); }
    
    /* Chart */
    .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; backdrop-filter: blur(16px); height: 400px; }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">Nova<span>/</span></div>
    <div class="nav-item active">Overview</div>
    <div class="nav-item">Markets</div>
    <div class="nav-item">Transactions</div>
    <div class="nav-item">Exchange</div>
    <div class="nav-item">Settings</div>
  </div>

  <div class="main">
    <div class="header">
      <h1 class="title space">Dashboard</h1>
      <button class="wallet-btn">0x4D...8f2C</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-lbl">Total Balance</div>
        <div class="stat-val">$124,560.00</div>
        <div class="stat-change up">▲ +12.5%</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Bitcoin (BTC)</div>
        <div class="stat-val">1.844 BTC</div>
        <div class="stat-change up" style="color:var(--cyan); background:rgba(0,229,255,0.1)">▲ +5.2%</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Ethereum (ETH)</div>
        <div class="stat-val">14.62 ETH</div>
        <div class="stat-change up">▲ +8.1%</div>
      </div>
    </div>

    <div class="chart-container">
      <h3 class="space" style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;">Portfolio Performance</h3>
      <canvas id="cryptoChart"></canvas>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('cryptoChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'],
        datasets: [{
          label: 'Value',
          data: [65000, 72000, 68000, 85000, 92000, 105000, 124560],
          borderColor: '#00FF66',
          backgroundColor: 'rgba(0, 255, 102, 0.1)',
          borderWidth: 3,
          fill: true,
          tension: 0.4,
          pointBackgroundColor: '#00FF66',
          pointBorderWidth: 2,
          pointRadius: 4,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8A92A6' } },
          y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8A92A6' } }
        }
      }
    });
  </script>
</body>
</html>
