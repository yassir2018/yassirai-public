<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Hub | Learn Faster</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #79CC3A; /* Duolingo-like Green */
      --primary-dark: #58A700;
      --secondary: #1CB0F6; /* Sky Blue */
      --text: #4B4B4B;
      --bg: #FFFFFF;
      --card: #F7F7F7;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }

    /* Top Navigation */
    .nav { padding: 1.5rem 10%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 2rem; font-weight: 900; color: var(--primary); letter-spacing: -1px; }
    
    .nav-links { display: flex; gap: 2rem; font-weight: 800; text-transform: uppercase; color: #AFDDED; }
    .nav-links a { color: #AFAFAF; }
    .nav-links a:hover { color: var(--text); }

    .header-btns { display: flex; gap: 1rem; }
    /* Gamified Buttons */
    .btn { font-family: 'Nunito'; font-weight: 800; font-size: 1rem; border: none; padding: 12px 24px; border-radius: 16px; cursor: pointer; text-transform: uppercase; transition: transform 0.1s; }
    .btn:active { transform: translateY(4px); box-shadow: none !important; }
    
    .btn-light { background: white; color: var(--secondary); border: 2px solid #E5E5E5; box-shadow: 0 4px 0 #E5E5E5; }
    .btn-light:hover { background: #F7F7F7; }
    
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 0 var(--primary-dark); }
    .btn-primary:hover { background: #88DB4A; }

    /* Hero Section */
    .hero { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 4rem 10%; gap: 6rem; }
    
    .h-text { flex: 1; max-width: 500px; text-align: center; }
    .h-text h1 { font-size: 3.5rem; font-weight: 900; color: var(--text); line-height: 1.2; margin-bottom: 2rem; }
    .h-actions { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
    .h-actions .btn { width: 100%; max-width: 300px; padding: 15px; font-size: 1.1rem; }

    /* Floating Globes / Elements */
    .h-img { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
    .globe { width: 400px; height: 400px; background: url('../../../assets/img/education-language-hub/auto-1.webp') center/cover; border-radius: 50%; border: 8px solid #E5E5E5; box-shadow: 0 20px 0 #DFDFDF; animation: bounce 6s infinite ease-in-out alternate; }
    
    @keyframes bounce { 0% { transform: translateY(-20px); } 100% { transform: translateY(20px); } }

    /* Badges */
    .badge { position: absolute; background: white; border: 2px solid #E5E5E5; border-radius: 16px; padding: 10px 20px; font-weight: 800; font-size: 1.2rem; color: var(--text); box-shadow: 0 4px 0 #E5E5E5; display: flex; align-items: center; gap: 10px; }
    .b-1 { top: 10%; left: 0; color: #FF9600; }
    .b-2 { bottom: 10%; right: 0; color: var(--secondary); }

    /* Flags section */
    .languages { padding: 4rem 10%; background: var(--card); border-top: 2px solid #E5E5E5; border-bottom: 2px solid #E5E5E5; text-align: center; }
    .l-grid { display: flex; justify-content: center; gap: 3rem; flex-wrap: wrap; margin-top: 2rem; }
    .flag { width: 60px; height: 60px; border-radius: 50%; background: #ccc; border: 3px solid white; box-shadow: 0 4px 0 #DFDFDF; cursor: pointer; transition: 0.2s; background-size: cover; background-position: center; }
    .flag:hover { transform: translateY(-5px); }

    .cta-band { padding: 5rem 10%; text-align: center; }
    .cta-band h1 { font-size: 2.5rem; margin-bottom: 1rem; color: var(--text); }
    .cta-band p { color: #888; margin-bottom: 2rem; font-weight: 600; font-size: 1.1rem; }

    .footer { padding: 3rem 10%; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #E5E5E5; color: #AFAFAF; font-weight: 600; font-size: 0.9rem; }
    .footer a:hover { color: var(--primary); }

    @media (max-width: 900px) {
      .nav-links { display: none; }
      .hero { flex-direction: column-reverse; gap: 4rem; padding: 2rem 5%; }
      .h-text h1 { font-size: 2.5rem; }
      .globe { width: 300px; height: 300px; }
      .badge { font-size: 1rem; }
      .footer { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="logo">LangHub</div>
    <div class="nav-links">
      <a href="#">Site Language: EN ▼</a>
    </div>
    <div class="header-btns">
      <button class="btn btn-light" style="color: #AFAFAF;">Site Language</button>
    </div>
  </nav>

  <section class="hero">
    <div class="h-img">
      <div class="badge b-1">🇪🇸 ¡Hola!</div>
      <div class="globe"></div>
      <div class="badge b-2">🇯🇵 こんにちは</div>
    </div>
    <div class="h-text">
      <h1>The free, fun, and effective way to learn a language!</h1>
      <div class="h-actions">
        <button class="btn btn-primary">Get Started</button>
        <button class="btn btn-light">I already have an account</button>
      </div>
    </div>
  </section>

  <section class="languages">
    <div class="l-grid">
      <!-- Approximated flags using colors/gradients for demo -->
      <div class="flag" style="background: linear-gradient(to right, #002B7F 33%, #FCD116 33%, #FCD116 66%, #CE1126 66%);" title="Romanian"></div>
      <div class="flag" style="background: linear-gradient(to bottom, #000 33%, #DD0000 33%, #DD0000 66%, #FFCE00 66%);" title="German"></div>
      <div class="flag" style="background: linear-gradient(to bottom, #C60C30 33%, #FFF 33%, #FFF 66%, #C60C30 66%);" title="Spanish"></div>
      <div class="flag" style="background: linear-gradient(to right, #002654 33%, #FFF 33%, #FFF 66%, #ED2939 66%);" title="French"></div>
      <div class="flag" style="background: linear-gradient(to right, #009246 33%, #FFF 33%, #FFF 66%, #CE2B37 66%);" title="Italian"></div>
      <div class="flag" style="background: radial-gradient(circle at center, #BC002D 30%, #FFF 30%);" title="Japanese"></div>
    </div>
  </section>

  <section class="cta-band">
    <h1>Learn a language for free. Forever.</h1>
    <p>Join 500 million+ learners around the world.</p>
    <button class="btn btn-primary" style="font-size: 1.2rem; padding: 1rem 3rem;">Get Started</button>
  </section>

  <footer class="footer">
    <span class="logo" style="font-size: 1.5rem;">LangHub</span>
    <div style="display: flex; gap: 2rem;"><a href="#">About</a><a href="#">Blog</a><a href="#">Schools</a><a href="#">Careers</a></div>
    <span>&copy; 2026 LangHub Inc.</span>
  </footer>
</body>
</html>
